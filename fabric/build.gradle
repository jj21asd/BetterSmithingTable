plugins {
    id 'com.gradleup.shadow'
    id 'common.process-resources'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")

    modImplementation("com.terraformersmc:modmenu:$mod_menu_version")
    modImplementation(include("eu.midnightdust:midnightlib:${midnight_version_fabric}"))

    // dependency of MidnightLib
    modLocalRuntime("net.fabricmc.fabric-api:fabric-api:$fabric_api_version")

    if (load_testing_mods.toBoolean()) {
        modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
        modLocalRuntime("dev.architectury:architectury-fabric:${architectury_api_version}")
        modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}")
        modLocalRuntime("maven.modrinth:brb:${brb_version}-fabric")
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric'))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
