plugins {
    id 'com.gradleup.shadow'
    id 'common.process-resources'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation("net.fabricmc:fabric-loader:$fabric_loader_version")

    modImplementation("com.terraformersmc:modmenu:$mod_menu_version")
    modImplementation(include("eu.midnightdust:midnightlib:${midnight_version_fabric}"))
    modImplementation(include("me.fallenbreath:conditional-mixin-fabric:$conditional_mixin_version"))

    if (load_testing_mods.toBoolean()) {
        modRuntimeOnly("net.fabricmc.fabric-api:fabric-api:$fabric_api_version")
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
    }

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionFabric'))
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
