plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = maven_group
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'
    apply plugin: 'architectury-plugin'
    // apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}"
    }

    repositories {
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "MidnightDust"
            url = "https://maven.midnightdust.eu/releases"
        }
        maven {
            name = "Jared's Maven"
            url = "https://maven.blamejared.com/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$minecraft_version"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaLanguageVersion.of(java_version)
        targetCompatibility = JavaLanguageVersion.of(java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = Integer.valueOf(java_version)
    }

    // configure Maven publishing
    /*publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
