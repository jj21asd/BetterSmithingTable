plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
}

architectury {
    minecraft = minecraft_version
}

allprojects {
    group = maven_group
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    // apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}"
    }

    repositories {
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            name = "MidnightDust"
            url = "https://maven.midnightdust.eu/releases"
        }
        maven {
            name = "Jared's Maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "Shedaniel"
            url = "https://maven.shedaniel.me/"
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaLanguageVersion.of(java_version)
        targetCompatibility = JavaLanguageVersion.of(java_version)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = Integer.valueOf(java_version)
    }
}

tasks.register("fixIdeaRuns", Delete) {
    group = "helpers"
    description = "Regenerates outdated IDEA run configs. DELETES ALL RUN CONFIGS!"
    delete(layout.projectDirectory.dir(".idea/runConfigurations"))
    finalizedBy {
        subprojects
                .findAll { it.tasks.names.contains('ideaSyncTask') }
                .collect { it.tasks.named('ideaSyncTask') }
    }
}