plugins {
    id 'common.process-resources'
}

architectury {
    common platforms.split(',')
}

dependencies {
    // make fabric loader @Environment annotations available
    implementation("net.fabricmc:fabric-loader:$fabric_loader_version")

    // make classes available at compile time
    // loader specific version is bundled in inside fabric/forge subprojects
    compileOnly("eu.midnightdust:midnightlib:$midnight_version_fabric")
    compileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
}

// force a sponge-mixin version before "at" on @Redirect was changed to an array
// the old MixinExtras version (0.4.5) bundled with NeoForge 26.2.0.88 doesn't support it
configurations.configureEach {
    resolutionStrategy {
        force "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    }
}
